version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_PATH=/app/data/media-downloader.db
      - REDIS_URL=redis://redis:6379
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme-in-production
      - JWT_SECRET=change-this-to-a-random-64-char-string
      - TEMP_DIR=/app/data/temp
      - TEMP_FILE_TTL_MINUTES=30
    volumes:
      - app_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  # Redis for production BullMQ
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
